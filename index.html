<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行业日报归档 · AI / 电商 / 箱包</title>
<style>
  :root {
    --bg: #fafaf8;
    --surface: #ffffff;
    --surface-2: #f4f6f1;
    --text: #1a1a1a;
    --text-secondary: #6b7280;
    --text-muted: #9ca3af;
    --border: #e0e3dc;
    --border-light: #e9ece5;
    --accent: #2d5016;
    --accent-light: #3a6b1e;
    --accent-bg: #eaf0e4;
    --tag-bg: #eaf0e4;
    --tag-text: #3a6b1e;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 6px 18px rgba(0,0,0,0.04);
    --radius: 8px;
    --radius-lg: 12px;
    --sidebar-width: 280px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.65;
    display: flex;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ========== SIDEBAR ========== */
  .sidebar {
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 10;
    overflow: hidden;
  }

  .brand {
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--border-light);
  }

  .brand h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: var(--text);
  }

  .brand .subtitle {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border-light);
  }

  .tab {
    flex: 1;
    padding: 7px 0;
    background: transparent;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }

  .tab:hover:not(.disabled) {
    background: var(--surface-2);
    color: var(--text);
  }

  .tab.active {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  .tab.disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  /* Archive list */
  .archive {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0 16px;
  }

  .archive::-webkit-scrollbar { width: 4px; }
  .archive::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 2px;
  }

  .archive-title {
    padding: 14px 20px 6px;
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .month-group { margin-bottom: 2px; }

  .month-toggle {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 10px 16px;
    margin: 0 4px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    user-select: none;
    transition: background 0.15s;
  }

  .month-toggle:hover { background: var(--surface-2); }

  .month-toggle .arrow {
    font-size: 10px;
    color: var(--text-secondary);
    transition: transform 0.2s;
    display: inline-block;
    width: 14px;
    text-align: center;
    margin-right: 4px;
  }

  .month-toggle:not(.collapsed) .arrow {
    transform: rotate(90deg);
  }

  .month-toggle .count {
    margin-left: auto;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
    background: var(--surface-2);
    padding: 1px 7px;
    border-radius: 10px;
    min-width: 22px;
    text-align: center;
  }

  .date-list { overflow: hidden; }

  .date-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 20px 7px 40px;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--text-secondary);
    transition: all 0.15s;
    border-left: 2px solid transparent;
    user-select: none;
  }

  .date-item:hover {
    background: var(--surface-2);
    color: var(--text);
  }

  .date-item.active {
    color: var(--accent);
    background: var(--accent-bg);
    border-left-color: var(--accent);
    font-weight: 600;
  }

  .date-item .weekday {
    font-size: 10px;
    opacity: 0.7;
  }

  .date-item .badge-new {
    margin-left: auto;
    font-size: 9px;
    padding: 1px 6px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .archive-empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
  }

  .archive-all {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 6px 14px 0;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: background 0.15s, color 0.15s;
  }

  .archive-all:hover {
    background: var(--surface-2);
    color: var(--text);
    text-decoration: none;
  }

  .sidebar-footer {
    padding: 14px 20px;
    font-size: 10px;
    color: var(--text-muted);
    border-top: 1px solid var(--border-light);
    text-align: center;
    letter-spacing: 0.5px;
  }

  /* ========== MAIN ========== */
  .main {
    flex: 1;
    margin-left: var(--sidebar-width);
    padding: 56px 64px 80px;
    min-height: 100vh;
    max-width: 920px;
  }

  .viewer-meta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--text-secondary);
    text-transform: uppercase;
    margin-bottom: 20px;
    font-weight: 500;
  }

  .viewer-meta .sep {
    color: var(--text-muted);
    opacity: 0.5;
  }

  .viewer-title {
    text-align: center;
    font-size: 44px;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 14px;
    color: var(--text);
    line-height: 1.2;
  }

  .viewer-subtitle {
    text-align: center;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 20px;
    letter-spacing: 0.3px;
  }

  /* Top anchor navigation */
  .top-anchor-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 28px;
    min-height: 0;
  }

  .top-anchor-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 500;
    transition: all 0.15s;
    cursor: pointer;
    white-space: nowrap;
  }

  .top-anchor-chip:hover {
    background: var(--accent-bg);
    color: var(--accent);
    border-color: var(--accent);
    text-decoration: none;
  }

  .top-anchor-chip.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 600;
  }

  .top-anchor-chip .count {
    font-weight: 600;
  }

  /* Subsection anchor navigation inside each section */
  .subsection-anchor-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 4px 0 18px 38px;
  }

  .subsection-anchor-chip {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 12px;
    background: var(--surface-2);
    border: 1px solid transparent;
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 500;
    transition: all 0.15s;
    white-space: nowrap;
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .subsection-anchor-chip:hover {
    background: var(--accent-bg);
    color: var(--accent);
    border-color: var(--accent);
    text-decoration: none;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin-bottom: 36px;
  }

  .report-content {
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 40px 48px;
    min-height: 400px;
  }

  .welcome {
    text-align: center;
    padding: 60px 20px;
  }

  .welcome .icon {
    font-size: 52px;
    margin-bottom: 16px;
  }

  .welcome h2 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--text);
  }

  .welcome p {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.8;
    max-width: 480px;
    margin: 0 auto;
  }

  .placeholder {
    text-align: center;
    padding: 80px 20px;
  }

  .placeholder .icon {
    font-size: 56px;
    margin-bottom: 16px;
    opacity: 0.4;
  }

  .placeholder h2 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--text);
  }

  .placeholder p {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .placeholder .hint {
    margin-top: 24px;
    display: inline-block;
    padding: 6px 14px;
    background: var(--accent-bg);
    color: var(--accent);
    font-size: 11px;
    border-radius: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .error-block {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
  }

  .error-block .icon {
    font-size: 48px;
    margin-bottom: 12px;
  }

  /* spinner */
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
  }

  .loading .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* 上下篇导航 */
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--border-light);
  }

  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text-secondary);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }

  .nav-btn:hover {
    background: var(--accent-bg);
    color: var(--accent);
    border-color: var(--accent);
  }

  .nav-btn.disabled {
    opacity: 0.3;
    cursor: not-allowed;
    pointer-events: none;
  }

  /* ========== RESPONSIVE ========== */
  @media (max-width: 900px) {
    body { flex-direction: column; }
    .sidebar {
      position: relative;
      width: 100%;
      min-width: unset;
      max-height: 45vh;
    }
    .main {
      margin-left: 0;
      padding: 24px 20px 60px;
    }
    .report-title { font-size: 32px; }
    .report-content { padding: 24px 20px; }
    .report-meta { font-size: 10px; gap: 8px; }
  }

  /* print */
  @media print {
    .sidebar, .nav-row { display: none; }
    .main { margin-left: 0; max-width: none; padding: 20px; }
  }

  /* ===== REPORT CONTENT STYLES (scoped to preserve single-report visuals) ===== */
  .report-content * { margin: 0; padding: 0; box-sizing: border-box; }

  .report-content {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    line-height: 1.7;
    padding: 0 !important;
    background: transparent !important;
  }

  .report-content .report-container {
    max-width: 880px;
    margin: 0 auto;
  }

  .report-content .report-main-title {
    font-size: 28px;
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 6px;
    letter-spacing: 0.3px;
  }

  .report-content .report-meta {
    display: flex;
    gap: 12px;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .report-content .report-meta .dot {
    color: var(--text-muted);
  }

  .report-content .report-intro {
    background: var(--surface);
    border-left: 3px solid var(--accent);
    padding: 16px 20px;
    border-radius: 0 var(--radius) var(--radius) 0;
    font-size: 14px;
    color: var(--text);
    margin-bottom: 36px;
    line-height: 1.8;
  }

  .report-content .section {
    margin-bottom: 40px;
  }

  .report-content .section-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .report-content .section-title .section-icon {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
  }

  .report-content .section-summary {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.8;
    margin-bottom: 20px;
    padding: 0 4px;
  }

  .report-content .subsection {
    margin-bottom: 28px;
  }

  .report-content .subsection-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 12px;
    padding-left: 12px;
    border-left: 3px solid var(--accent);
  }

  .report-content .news-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .report-content .news-list li {
    background: #ffffff;
    border: 1px solid var(--border-light);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 10px;
    transition: box-shadow 0.15s;
  }

  .report-content .news-list li:hover {
    box-shadow: var(--shadow);
  }

  .report-content .news-item-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 6px;
  }

  .report-content .news-item-head .bullet {
    color: var(--accent);
    font-weight: 700;
    flex-shrink: 0;
  }

  .report-content .news-item-head .news-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.5;
  }

  .report-content .news-body {
    font-size: 13px;
    color: #555;
    line-height: 1.7;
    margin-bottom: 8px;
  }

  .report-content .news-source {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-muted);
  }

  .report-content .news-source .source-tag {
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--tag-bg);
    color: var(--tag-text);
    font-weight: 500;
    font-size: 10px;
  }

  .report-content .news-source a {
    color: var(--accent);
    text-decoration: none;
  }

  .report-content .news-source a:hover {
    text-decoration: underline;
  }

  .report-content .report-footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.8;
  }

  @media (max-width: 600px) {
    .report-content .report-main-title { font-size: 22px; }
    .report-content .section-title { font-size: 18px; }
    .report-content .news-list li { padding: 14px 16px; }
  }
</style>
</head>
<body>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar">
  <div class="brand">
    <h1>📰 行业日报</h1>
    <div class="subtitle">箱包 · 电商 · AI</div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="daily">日报</button>
    <button class="tab disabled" data-tab="weekly" disabled title="即将上线">周报</button>
    <button class="tab disabled" data-tab="monthly" disabled title="即将上线">月报</button>
    <button class="tab disabled" data-tab="yearly" disabled title="即将上线">年报</button>
  </div>

  <nav class="archive" id="archive">
    <div class="loading" style="padding:30px;">
      <div class="spinner"></div>
      <div style="font-size:11px;">加载归档...</div>
    </div>
  </nav>

  <div class="sidebar-footer">
    每日 10:00 自动更新 · WorkBuddy
  </div>
</aside>

<!-- ===== MAIN CONTENT ===== -->
<main class="main">
  <div class="viewer-meta">
    <span>VOL.<span id="metaDate">--</span></span>
    <span class="sep">·</span>
    <span><span id="metaCount">--</span> 条</span>
    <span class="sep">·</span>
    <span>行业日报</span>
  </div>
  <h1 class="viewer-title">行业日报</h1>
  <div class="viewer-subtitle" id="reportSubtitle">-- · -- · DAILY · 每日十时</div>
  <div class="top-anchor-nav" id="topAnchorNav" style="display:none;"></div>
  <div class="divider"></div>
  <div class="report-content" id="reportContent">
    <div class="loading">
      <div class="spinner"></div>
      加载日报数据...
    </div>
  </div>
</main>

<script>
const MANIFEST_URL = 'manifest.json';

let manifest = [];
let currentTab = 'daily';
let currentDate = null;

const MONTH_CN = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const WEEKDAY_CN = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const WEEKDAY_CN_SHORT = ['周日','周一','周二','周三','周四','周五','周六'];

const NOW = new Date();
const TODAY_STR =
  `${NOW.getFullYear()}-${String(NOW.getMonth()+1).padStart(2,'0')}-${String(NOW.getDate()).padStart(2,'0')}`;

function cnDateSimple(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return `${y}年${m}月${d}日`;
}

function weekdayOf(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return WEEKDAY_CN[d.getDay()];
}

async function init() {
  try {
    const resp = await fetch(MANIFEST_URL, { cache: 'no-cache' });
    if (!resp.ok) throw new Error('Manifest not found');
    manifest = await resp.json();
    if (!Array.isArray(manifest)) manifest = [];
  } catch (e) {
    manifest = [];
  }

  buildSidebar();

  if (manifest.length > 0) {
    const sorted = [...manifest].sort((a, b) => a.date.localeCompare(b.date));
    loadReport(sorted[sorted.length - 1]);
  } else {
    showWelcome();
  }
}

function buildSidebar() {
  const archive = document.getElementById('archive');

  if (manifest.length === 0) {
    archive.innerHTML =
      '<div class="archive-empty">暂无日报归档</div>';
    return;
  }

  // 按年-月分组
  const grouped = {};
  manifest.forEach(entry => {
    const [y, m] = entry.date.split('-');
    if (!grouped[y]) grouped[y] = {};
    if (!grouped[y][m]) grouped[y][m] = [];
    grouped[y][m].push(entry);
  });

  const years = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

  let html = '';

  years.forEach((year) => {
    const months = Object.keys(grouped[year]).sort((a, b) => b.localeCompare(a));
    months.forEach((month) => {
      const entries = grouped[year][month];
      // 参考 AIHOT 样式：默认全部折叠
      const isExpanded = false;

      html += `<div class="month-group">`;
      html += `<div class="month-toggle${isExpanded ? '' : ' collapsed'}" data-ym="${year}-${month}" onclick="toggleMonth(this)">`;
      html += `<span class="arrow">&gt;</span> ${year}年${parseInt(month)}月`;
      html += `<span class="count">${entries.length}</span>`;
      html += `</div>`;
      html += `<div class="date-list" id="month-${year}-${month}" style="${isExpanded ? '' : 'display:none;'}">`;

      entries
        .slice()
        .sort((a, b) => b.date.localeCompare(a.date))
        .forEach((entry, idx) => {
          const [, , d] = entry.date.split('-');
          const wd = WEEKDAY_CN_SHORT[new Date(entry.date + 'T00:00:00').getDay()];
          const isToday = entry.date === TODAY_STR;
          const isActive = currentDate && entry.date === currentDate ? 'active' : '';
          const showNew = isToday;

          html += `<div class="date-item ${isActive}" data-date="${entry.date}" onclick="onDateClick('${entry.date}', this)">`;
          html += `<span>${parseInt(d)}日</span>`;
          html += `<span class="weekday">${wd}</span>`;
          if (showNew) html += `<span class="badge-new">新</span>`;
          html += `</div>`;
        });

      html += `</div></div>`;
    });
  });

  html += `<a class="archive-all" href="#" onclick="expandAllMonths(); return false;">全部日报 &gt;</a>`;

  archive.innerHTML = html;
}

function toggleMonth(el) {
  el.classList.toggle('collapsed');
  const ym = el.dataset.ym;
  const [y, m] = ym.split('-');
  const list = document.getElementById(`month-${y}-${m}`);
  if (list) list.style.display = el.classList.contains('collapsed') ? 'none' : 'block';
}

function expandAllMonths() {
  document.querySelectorAll('.month-toggle.collapsed').forEach(el => {
    el.classList.remove('collapsed');
    const ym = el.dataset.ym;
    const [y, m] = ym.split('-');
    const list = document.getElementById(`month-${y}-${m}`);
    if (list) list.style.display = 'block';
  });
}

function scrollToAnchor(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const headerOffset = 24;
  const y = el.getBoundingClientRect().top + window.pageYOffset - headerOffset;
  window.scrollTo({ top: y, behavior: 'smooth' });
}

function detectSectionKey(section) {
  const titleEl = section.querySelector('.section-title');
  if (!titleEl) return null;
  const iconEl = titleEl.querySelector('.section-icon');
  const iconText = iconEl ? iconEl.textContent.trim() : '';
  const titleText = titleEl.textContent.trim();
  if (iconText === 'BG' || titleText.includes('箱包')) return 'bags';
  if (iconText === 'EC' || titleText.includes('电商')) return 'ec';
  if (iconText === 'AI' || titleText.includes('AI')) return 'ai';
  return 'section';
}

function sectionDisplayName(key) {
  if (key === 'bags') return '箱包';
  if (key === 'ec') return '电商';
  if (key === 'ai') return 'AI';
  return '其他';
}

function buildReportAnchors() {
  const main = document.getElementById('reportContent');
  const topNav = document.getElementById('topAnchorNav');
  const sections = main.querySelectorAll('.section');

  if (sections.length === 0) {
    topNav.style.display = 'none';
    topNav.innerHTML = '';
    return;
  }

  let totalCount = 0;
  const sectionData = [];

  sections.forEach((section, sIdx) => {
    const key = detectSectionKey(section) || ('sec-' + sIdx);
    section.id = 'section-' + key + '-' + sIdx;

    const titleEl = section.querySelector('.section-title');
    const titleText = titleEl ? titleEl.textContent.trim() : '板块' + (sIdx + 1);
    const shortTitle = titleText.replace(/^\s*(AI|EC|BG)\s*/, '').replace(/动态$/, '').trim() || sectionDisplayName(key);

    const lis = section.querySelectorAll('.news-list li');
    const count = lis.length;
    totalCount += count;

    // 给 subsection 加 id 并收集分类导航
    const subsections = section.querySelectorAll('.subsection');
    const subNavItems = [];
    subsections.forEach((sub, subIdx) => {
      const subTitleEl = sub.querySelector('.subsection-title');
      if (!subTitleEl) return;
      const subTitle = subTitleEl.textContent.trim();
      sub.id = 'sub-' + key + '-' + sIdx + '-' + subIdx;
      subNavItems.push({ id: sub.id, title: subTitle });
    });

    // 在该板块标题后插入分类锚点导航
    if (subNavItems.length > 0 && titleEl) {
      // 先移除旧的（切换日期时）
      const existing = titleEl.parentElement.querySelector('.subsection-anchor-nav');
      if (existing) existing.remove();

      const subNavHtml =
        '<div class="subsection-anchor-nav">' +
        subNavItems.map(item =>
          `<a class="subsection-anchor-chip" href="#${item.id}" onclick="scrollToAnchor('${item.id}'); return false;" title="${item.title}">${item.title}</a>`
        ).join('') +
        '</div>';
      titleEl.insertAdjacentHTML('afterend', subNavHtml);
    }

    sectionData.push({ id: section.id, title: shortTitle, count });
  });

  // 生成顶部板块导航
  const topNavHtml =
    '<span class="top-anchor-chip primary">当日总条数 <span class="count">' + totalCount + '</span></span>' +
    sectionData.map(s =>
      `<a class="top-anchor-chip" href="#${s.id}" onclick="scrollToAnchor('${s.id}'); return false;">${s.title} <span class="count">${s.count}</span></a>`
    ).join('');

  topNav.innerHTML = topNavHtml;
  topNav.style.display = 'flex';
}

async function onDateClick(dateStr, el) {
  document.querySelectorAll('.date-item').forEach(i => i.classList.remove('active'));
  if (el) el.classList.add('active');
  const entry = manifest.find(e => e.date === dateStr);
  if (entry) await loadReport(entry);
}

async function loadReport(entry) {
  currentDate = entry.date;

  // 更新顶部 meta
  document.getElementById('metaDate').textContent = entry.date.replace(/-/g, '.');
  document.getElementById('reportSubtitle').textContent =
    `${cnDateSimple(entry.date)} · ${weekdayOf(entry.date)} · DAILY · 每日十时`;

  const main = document.getElementById('reportContent');
  document.getElementById('topAnchorNav').style.display = 'none';
  main.innerHTML =
    '<div class="loading">' +
    '<div class="spinner"></div>正在加载 ' + entry.date + ' 日报...</div>';

  try {
    const resp = await fetch(entry.path, { cache: 'no-cache' });
    if (!resp.ok) throw new Error('Report not found');
    const html = await resp.text();

    // 提取 <body> 内文（去掉外壳 head/style/script）
    const bodyMatch = html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
    let content = bodyMatch ? bodyMatch[1] : html;
    // 移除内嵌的 <script>（防御性，避免重复执行）
    content = content.replace(/<script[\s\S]*?<\/script>/gi, '');

    // 条目数计数（li 元素）
    const tmp = document.createElement('div');
    tmp.innerHTML = content;
    const liCount = tmp.querySelectorAll('li').length;
    document.getElementById('metaCount').textContent = liCount;

    main.innerHTML = content;

    // 构建板块 / 分类锚点导航
    buildReportAnchors();

    // 上下篇导航
    const sorted = [...manifest].sort((a, b) => a.date.localeCompare(b.date));
    const idx = sorted.findIndex(e => e.date === entry.date);
    const prev = idx > 0 ? sorted[idx - 1] : null;
    const next = idx < sorted.length - 1 ? sorted[idx + 1] : null;

    const navHtml =
      '<div class="nav-row">' +
      (prev
        ? `<button class="nav-btn" onclick="onDateClick('${prev.date}', null)">← ${cnDateSimple(prev.date)}</button>`
        : '<span></span>') +
      (next
        ? `<button class="nav-btn" onclick="onDateClick('${next.date}', null)">${cnDateSimple(next.date)} →</button>`
        : '<span></span>') +
      '</div>';
    main.insertAdjacentHTML('beforeend', navHtml);

    // 更新侧边栏高亮
    document.querySelectorAll('.date-item').forEach(i => {
      i.classList.remove('active');
      if (i.dataset.date === entry.date) i.classList.add('active');
    });

    // 滚动到顶
    window.scrollTo({ top: 0, behavior: 'smooth' });

  } catch (e) {
    document.getElementById('topAnchorNav').style.display = 'none';
    main.innerHTML =
      '<div class="error-block">' +
      '<div class="icon">⚠️</div>' +
      '<h3 style="font-size:16px;margin-bottom:6px;">加载失败</h3>' +
      '<p style="font-size:13px;">无法加载 ' + entry.date + ' 的日报，文件可能不存在。</p>' +
      '</div>';
  }
}

function showWelcome() {
  document.getElementById('metaDate').textContent = '--';
  document.getElementById('metaCount').textContent = '--';
  document.getElementById('reportSubtitle').textContent = '尚无数据 · -- · DAILY · 每日十时';
  document.getElementById('topAnchorNav').style.display = 'none';
  document.getElementById('topAnchorNav').innerHTML = '';
  document.getElementById('reportContent').innerHTML =
    '<div class="welcome">' +
    '<div class="icon">📰</div>' +
    '<h2>行业日报系统已就绪</h2>' +
    '<p>每天上午 10:00 自动生成当日行业日报，<br>覆盖 AI、电商、箱包三大板块。<br>首份日报生成后，刷新本页即可在此查看。</p>' +
    '</div>';
}

function showPlaceholder(tabName, hint) {
  document.getElementById('metaDate').textContent = '--';
  document.getElementById('metaCount').textContent = '--';
  document.getElementById('reportSubtitle').textContent = '-- · -- · -- · WorkBuddy';
  document.getElementById('topAnchorNav').style.display = 'none';
  document.getElementById('topAnchorNav').innerHTML = '';
  document.getElementById('reportContent').innerHTML =
    '<div class="placeholder">' +
    '<div class="icon">📊</div>' +
    `<h2>${tabName}即将上线</h2>` +
    `<p>${hint}</p>` +
    (manifest.length > 0
      ? `<p style="font-size:12px;color:var(--text-muted);margin-top:16px;">当前已有 ${manifest.length} 期日报，未来可用于汇总分析。</p>`
      : '') +
    '<span class="hint">即将开放 · WorkBuddy</span>' +
    '</div>';
}

// ===== Tab switching =====
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    if (tab.classList.contains('disabled')) return;
    if (tab.classList.contains('active')) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    handleTabChange();
  });
});

function handleTabChange() {
  if (currentTab === 'daily') {
    // 切回日报：恢复之前选中的日期，或最新一期
    if (currentDate) {
      const entry = manifest.find(e => e.date === currentDate);
      if (entry) { loadReport(entry); return; }
    }
    if (manifest.length > 0) {
      const sorted = [...manifest].sort((a,b) => a.date.localeCompare(b.date));
      loadReport(sorted[sorted.length - 1]);
    } else {
      showWelcome();
    }
  } else if (currentTab === 'weekly') {
    showPlaceholder('周报', '按周汇总 AI / 电商 / 箱包 三大板块的行业要点与趋势。');
  } else if (currentTab === 'monthly') {
    showPlaceholder('月报', '按月回顾重要发布、商业动向、监管变化和消费者趋势。');
  } else if (currentTab === 'yearly') {
    showPlaceholder('年报', '按年回顾宏观格局演变、关键节点与年度行业地图。');
  }
}

// 启动
init();
</script>
